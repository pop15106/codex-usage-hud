name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Build Windows bundle
        run: npm run tauri build -- --no-sign

      - name: Prepare installer, portable build, and checksums
        shell: pwsh
        run: |
          $out = "dist-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "找不到 NSIS 安裝檔" }

          Copy-Item $installer.FullName "$out/Codex.Usage.HUD_x64-setup.exe"
          Copy-Item "src-tauri/target/release/codex-usage-hud.exe" "$out/Codex.Usage.HUD_x64-portable.exe"

          Get-ChildItem "$out/*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-usage-hud-windows
          path: dist-release/*
          if-no-files-found: error
